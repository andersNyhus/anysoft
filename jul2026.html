<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juleøltest</title>
<style>
:root{--bg:#1c1514;--card:#2a201e;--line:#40302d;--text:#f6ece4;--muted:#b6a397;--accent:#d4ac4f;--accent-ink:#1c1514;--done:#3f7d5a;--red:#b23a33}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.7rem;margin:8px 0 4px}
h2{font-size:1.25rem;margin:4px 0 12px}
.muted{color:var(--muted);font-size:.95rem}
input{width:100%;font-size:1.1rem;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);margin:12px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.primary{width:100%;padding:15px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.1rem}
.primary:disabled{opacity:.4}
.ghost{background:none;color:var(--muted);text-decoration:underline;padding:8px 0}
.switch{display:flex;gap:8px;margin:10px 0 16px;background:var(--card);padding:6px;border:1px solid var(--line);border-radius:12px}
.switch button{flex:1;padding:10px 12px;border-radius:8px;background:transparent;border:0;color:var(--muted);font-weight:700;cursor:pointer}
.switch button.on{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.beer{aspect-ratio:1;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:1.4rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center}
.beer small{font-size:.7rem;font-weight:500;color:var(--muted)}
.beer.done{background:var(--done);border-color:var(--done)}
.beer.done small{color:#e3f1e8}
.list-panel,.candidate-panel{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.list-item,.candidate-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;color:var(--text);font:inherit;text-align:left}
.list-item{cursor:pointer}
.list-item strong{color:var(--accent);font-size:1.1rem}
.candidate-item{cursor:pointer;padding-right:10px}
.candidate-main{flex:1;min-width:0}
.candidate-item strong{display:block;font-size:1rem;line-height:1.3}
.candidate-item small{color:var(--muted);display:block;margin-top:2px;line-height:1.35}
.candidate-open{width:38px;height:38px;border-radius:10px;background:rgba(212,172,79,.14);color:var(--accent);font-size:1.5rem;line-height:1;border:1px solid rgba(212,172,79,.35);flex-shrink:0}
.detail-overlay{position:fixed;inset:0;background:rgba(12,9,9,.7);display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow-y:auto;z-index:50}
.detail-sheet{width:min(100%, 560px);background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:18px 16px 20px;box-shadow:0 18px 60px rgba(0,0,0,.38);margin:20px auto 30px}
.detail-sheet .row{padding-bottom:8px}
.detail-sheet .ghost{padding:0 0 0 8px;color:var(--accent)}
.beer-detail{display:flex;flex-direction:column;gap:16px}
.beer-detail .image-wrap{background:#231c19;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:220px}
.beer-detail img{display:block;max-width:100%;max-height:260px;object-fit:contain;background:#fff;padding:8px;border-radius:8px}
.beer-detail .meta{display:grid;grid-template-columns:1fr;gap:8px}
.beer-detail .meta-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.beer-detail .meta-row:last-child{border-bottom:0}
.beer-detail .meta-row strong{font-size:.9rem;color:var(--muted);font-weight:700}
.beer-detail .meta-row span{font-weight:600;text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.cat{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.cat .val{color:var(--accent)}
.cat em{font-style:normal;font-size:.75rem;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.card.key{border:2px solid var(--accent);background:#3a2b1c;padding:16px 12px;box-shadow:0 0 0 4px rgba(212,172,79,.12)}
.card.key .cat{font-size:1.25rem}
.card.key .scale button{height:50px;font-size:1.05rem}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{height:42px;background:var(--bg);color:var(--text);border:1px solid var(--line);font-weight:600;padding:0}
.scale button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.total{text-align:center;font-size:1.1rem;margin:14px 0}
.total b{font-size:1.6rem;color:var(--accent)}
.res{display:flex;align-items:center;gap:12px}
.place{font-size:1.4rem;font-weight:800;width:2.2em;text-align:center;color:var(--accent)}
.res .name{font-weight:700}
.res .score{margin-left:auto;font-size:1.5rem;font-weight:800}
.hidden .name,.hidden .score{color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btns button{flex:1;padding:12px;background:var(--card);color:var(--text);border:1px solid var(--line)}
.btns .primary{flex-basis:100%}
.banner{background:#3a2a10;border:1px solid #6b5220;color:#f0d9a0;border-radius:10px;padding:8px 12px;font-size:.85rem;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<script>
// ======= INNSTILLINGER =======
const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyiD8O0eVQuYBw5e6SKdqFDAQ_Sgi2WvlubYIXv8BYiZYgKoumlojK_wdPojEntVUp-/exec',            // Lim inn URL-en til Google Apps Script-web-appen her. Tom = demomodus.
  ANTALL_OL: 24,
  KATEGORIER: ['Farge', 'Aroma', 'Smak', 'Ettersmak'],
  VEKTER:     [1, 1, 2, 1],  // Smak teller dobbelt
  KANDIDATER: [],  // Kandidater leses fra Google Sheet via api('results').names, ikke fra en lokal liste.
};
// =============================

const $ = s => document.querySelector(s);
const DEMO = !CONFIG.SCRIPT_URL;
const CANDIDATE_METADATA = {
  'høkunatt julebock': { name: 'Høkunatt Julebock', producer: 'Rygr Brygghus', style: 'Julebock', abv: '4,7 %', volume: '0,33 l', package: 'boks', image: 'catalog/images/b-rygr-brygghus-hokunatt-julebock.png', note: '2026-utgaven, brygget på norsk malt; passer til tradisjonell julemat.' },
  'e.c. dahls hovmesteren juleøl': { name: 'E.C. Dahls Hovmesteren Juleøl', producer: 'Ringnes (E.C. Dahls)', style: 'Mørkt belgisk-inspirert juleøl', abv: '4,6 %', volume: '0,75 l', package: 'flaske', image: 'catalog/images/b-ringnes-e-c-dahls-e-c-dahls-hovmesteren-juleol.png', note: 'Brygget med kakaonibs, sviskejuice, appelsinskall og kanel; selges på 0,75 l flaske.' },
  'mack alkoholfri juleøl': { name: 'Mack Alkoholfri Juleøl', producer: 'Macks Ølbryggeri', style: 'Juleøl', abv: '0,5 %', volume: '0,33 l', package: 'boks', image: 'catalog/images/b-macks-olbryggeri-mack-alkoholfri-juleol.png', note: 'Alkoholfri versjon av Macks klassiske juleøl; server ved 2–6 °C til aperitiff, ost og julemat.' },
  'nova 6.0': { name: 'Nova 6.0', producer: 'Monkey Brew', style: 'NEIPA', abv: '4,7 %', volume: '0,33 l', package: 'boks', image: 'catalog/images/b-monkey-brew-nova-6-0.jpg', note: 'Bryggeriets årlige jule-NEIPA (sesong: jul); boks.' },
  'frydenlund juleøl': { name: 'Frydenlund Juleøl', producer: 'Ringnes (Frydenlund)', style: 'Bayer/Mørk lager', abv: '4,5 %', volume: '0,5 l', package: 'boks', image: 'catalog/images/b-ringnes-frydenlund-frydenlund-juleol.png', note: 'Brygget med lakris; passer til ribbe, pinnekjøtt, kalkun og lutefisk, eller nøtter og rosiner.' },
  'munkholm juleøl': { name: 'Munkholm Juleøl', producer: 'Ringnes (Munkholm)', style: 'Juleøl', abv: '4,7 %', volume: '0,33 l', package: 'boks', image: 'catalog/images/b-ringnes-munkholm-munkholm-juleol.png', note: 'Laget med avbrutt gjæring; serveres ved 3–6 °C til julemat og småkaker.' },
  'tuftkall': { name: 'Tuftkall', producer: 'Bryggeriet Frøya', style: 'Juleøl, mørk lager', abv: '4,7 %', volume: '0,33 l', package: 'flaske', image: 'catalog/images/b-bryggeriet-froya-tuftkall.jpg', note: 'Klassisk undergjæret juleøl til julematen; allergener: sitrus og bygg.' },
  'nordlands juleøl': { name: 'Nordlands Juleøl', producer: 'Ringnes (Nordlands)', style: 'Bayer/Mørk lager', abv: '4,5 %', volume: '0,5 l', package: 'boks', image: 'catalog/images/b-ringnes-nordlands-nordlands-juleol.png', note: 'Til ribbe, pinnekjøtt, lutefisk og torsk, eller julekaker, sjokolade og nøtter.' },
  'lucky jack black xmas ipa': { name: 'Lucky Jack Black Xmas IPA', producer: 'Lervig', style: 'Black IPA', abv: '4,7 %', volume: '0,5 l', package: 'boks', image: 'catalog/images/b-lervig-lucky-jack-black-xmas-ipa.png', note: 'Julevariant av Lucky Jack; vegansk og glutenfri, 50 cl boks.' },
  'mer jul enn jesus': { name: 'Mer Jul Enn Jesus', producer: '7 Fjell Bryggeri', style: 'Mørk ale', abv: '4,7 %', volume: '0,33 l', package: 'flaske', image: 'catalog/images/b-7-fjell-bryggeri-mer-jul-enn-jesus.png', note: 'Tenkt til eller i stedet for dessert; inneholder laktose og havre.' },
  'aass juleøl': { name: 'Aass Juleøl', producer: 'Aass Bryggeri', style: 'Mørk lager', abv: '4,7 %', volume: '0,5 l', package: 'boks', image: 'catalog/images/b-aass-bryggeri-aass-juleol.png', note: 'Vann, byggmalt og humle; server ved ca. 9 °C til kraftige, tunge retter.' },
  'julefred': { name: 'Julefred', producer: 'Kinn Bryggeri', style: 'Skotsk øl', abv: '4,7 %', volume: '0,75 l', package: 'flaske', image: 'catalog/images/b-kinn-bryggeri-julefred.png', note: 'Dagligvareversjonen med grønn etikett, laget til pinnekjøtt; passer også til ribbe.' },
  'nordstjerna': { name: 'Nordstjerna', producer: 'Hogna Brygg', style: 'Juleøl', abv: '4,7 %', volume: '0,44 l', package: 'boks', image: 'catalog/images/b-hogna-brygg-nordstjerna.png', note: 'Laget for både tradisjonell og moderne julemat; med norsk havre.' },
  'e.c. dahls lille bjørn juleøl': { name: 'E.C. Dahls Lille Bjørn Juleøl', producer: 'Ringnes (E.C. Dahls)', style: 'Belgisk dubbel-inspirert (session)', abv: '4,6 %', volume: '0,5 l', package: 'boks', image: 'catalog/images/b-ringnes-e-c-dahls-e-c-dahls-lille-bjorn-juleol.png', note: 'Krydret med koriander, fennikel, karve, stjerneanis og appelsinskall; til pinnekjøtt og ribbe.' },
  'cb juleøl': { name: 'CB Juleøl', producer: 'Hansa Borg Bryggerier', style: 'undergjæret øl', abv: '4,7 %', volume: '0,33 l', package: 'flaske', image: 'catalog/images/b-hansa-borg-bryggerier-cb-juleol.jpg', note: 'Serveres ved 6–10 °C; til lam, svin og fisk, særlig røkelaks.' },
  'no worries driving home for christmas': { name: 'No Worries Driving Home for Christmas', producer: 'Lervig', style: 'Alkoholfri juleale', abv: '0,5 %', volume: '0,33 l', package: 'boks', image: 'catalog/images/b-lervig-no-worries-driving-home-for-christmas.png', note: 'Brygget med hvete og kanel; vegansk, 33 cl boks.' },
  'grans juleøl': { name: 'Grans Juleøl', producer: 'Grans Bryggeri', style: 'Juleøl', abv: '4,7 %', volume: '0,5 l', package: 'boks', image: 'catalog/images/b-grans-bryggeri-grans-juleol.png', note: 'Lett humlet og krydret med granskudd; server ved 4–8 °C til vilt, gryter, sjokolade, nøtter og ost.' },
  'aass bryggerimesterens juleøl': { name: 'Aass Bryggerimesterens Juleøl', producer: 'Aass Bryggeri', style: 'Mørk Ale', abv: '4,7 %', volume: '0,5 l', package: 'boks', image: 'catalog/images/b-aass-bryggeri-aass-bryggerimesterens-juleol.png', note: 'Med havremalt, melasse, appelsin, vanilje og kanel; server ved ca. 9 °C til kraftig mat.' },
  'mack juleøl 4,5 %': { name: 'Mack Juleøl 4,5 %', producer: 'Macks Ølbryggeri', style: 'Juleøl', abv: '4,5 %', volume: '0,5 l', package: 'boks', image: 'catalog/images/b-macks-olbryggeri-mack-juleol-4-5.png', note: 'Vann, byggmalt og humle; server ved 4–6 °C til koldtbord, lam og svin.' },
  'tys jol': { name: 'Tys Jol', producer: 'Bryggeriet Frøya', style: 'Brown Ale', abv: '4,7 %', volume: '0,33 l', package: 'flaske', image: 'catalog/images/b-bryggeriet-froya-tys-jol.jpg', note: 'Foreslås til lutefisk med bacon, kjøttgryter, shepherd’s pie og ost.' },
  'mack vellagret juleøl': { name: 'Mack Vellagret Juleøl', producer: 'Macks Ølbryggeri', style: 'Juleøl', abv: '4,5 %', volume: '0,5 l', package: 'boks', image: 'catalog/images/b-macks-olbryggeri-mack-vellagret-juleol.png', note: 'Ekstra lang lagring; server ved 6–8 °C til pinnekjøtt, ribbe, lam, svin og koldtbord.' },
  'uten juleøl': { name: 'UTEN Juleøl', producer: 'Aass Bryggeri', style: 'Mørk lager', abv: '0,5 %', volume: '0,5 l', package: 'boks', image: 'catalog/images/b-aass-bryggeri-uten-juleol.png', note: 'Alkoholfritt juleøl laget for god julemat; vann, byggmalt og humle, server ved ca. 9 °C.' },
  'julestjerne': { name: 'Julestjerne', producer: '7 Fjell Bryggeri', style: 'Lyst belgiskinspirert juleøl', abv: '4,7 %', volume: '0,33 l', package: 'flaske', image: 'catalog/images/b-7-fjell-bryggeri-julestjerne.png', note: 'Med koriander samt appelsin- og mandarinolje; foreslås til kalkun og juletorsk.' },
  'brukbar-jolagåva': { name: 'Brukbar-Jolagåva', producer: 'Voss Fellesbryggeri', style: 'Jolaøl med kveik', abv: '4,7 %', volume: '0,33 l', package: 'boks', image: 'catalog/images/b-voss-fellesbryggeri-brukbar-jolagaava.png', note: 'Overgjæret med vosskveik og ufiltrert; til all julemat, best ved 6–9 °C.' }
};
const normalizeCandidateKey = value => String(value || '')
  .normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '')
  .toLowerCase()
  .replace(/[^a-z0-9]+/g, ' ')
  .trim();
const CANDIDATE_METADATA_LOOKUP = Object.fromEntries(
  Object.entries(CANDIDATE_METADATA).map(([key, value]) => [normalizeCandidateKey(key), value])
);
const getCandidateMeta = name => CANDIDATE_METADATA_LOOKUP[normalizeCandidateKey(name)] || null;
const mem = {};
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ delete mem[k]; try { localStorage.removeItem(k); } catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VSUM = CONFIG.VEKTER.reduce((a,b)=>a+b,0);
const score = s => s.reduce((a,v,i)=>a + v*CONFIG.VEKTER[i], 0) / VSUM;   // vektet snitt 1–10
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
let mine = {};          // { ølnr: [4 poeng] }
let listMode = 'form';
let candidateRows = [];

function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove('show'), 1800); }
function show(html){ $('#app').innerHTML = (DEMO ? '<div class="banner">Demomodus – svar lagres bare på denne enheten.</div>' : '') + html; window.scrollTo(0,0); }
function renderToggle(active = listMode){
  const labels = { form: 'Skjema', list: 'List', candidate: 'Kandidater' };
  return `<div class="switch">${['form','list','candidate'].map(mode => `<button type="button" class="${active === mode ? 'on' : ''}" data-mode="${mode}">${labels[mode]}</button>`).join('')}</div>`;
}

async function api(action, payload = {}){
  if (DEMO){
    let all = store.get('jot_demo') || [];
    if (action === 'save'){
      all = all.filter(r => !(r.id === payload.id && r.beer === payload.beer));
      all.push({ id: payload.id, name: payload.name, beer: payload.beer, s: payload.scores });
      store.set('jot_demo', all); return { ok: true };
    }
    if (action === 'mine') return { rows: all.filter(r => r.id === payload.id) };
    return { rows: all, names: {} };
  }
  if (action === 'save'){
    const r = await fetch(CONFIG.SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Feil'); return j;
  }
  const u = new URL(CONFIG.SCRIPT_URL);
  u.searchParams.set('action', action);
  if (payload.id) u.searchParams.set('id', payload.id);
  const r = await fetch(u); return r.json();
}

// ---------- Deltager ----------
function viewName(){
  show(`<h1>🍺 Juleøltest</h1>
    <p class="muted">Skriv navnet ditt. Telefonen husker deg resten av kvelden.</p>
    <input id="nm" placeholder="Fornavn" autocomplete="given-name" maxlength="40">
    <button id="go" class="primary">Start</button>`);
  const go = () => {
    const n = $('#nm').value.trim(); if (!n) return;
    // Samme navn på samme enhet = samme ID (ikke skille på store/små bokstaver)
    const ids = store.get('jot_ids') || {};
    const key = n.toLocaleLowerCase('nb');
    if (!ids[key]) { ids[key] = newId(); store.set('jot_ids', ids); }
    store.set('jot_user', { id: ids[key], name: n });
    start();
  };
  $('#go').onclick = go;
  $('#nm').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#nm').focus();
}

async function start(){
  const u = store.get('jot_user');
  if (!u) return viewName();
  viewList();
  try {
    const r = await api('mine', { id: u.id });
    mine = {}; (r.rows || []).forEach(x => mine[x.beer] = x.s);
    if (!location.hash) viewList();
  } catch(e){ toast('Fikk ikke hentet tidligere svar'); }
}

async function loadCandidateRows(){
  if (!DEMO) {
    try {
      const res = await api('results');
      const names = res && res.names ? res.names : {};
      const liveRows = Object.entries(names)
        .map(([glass, name]) => ({ glass: Number(glass), name: String(name) }))
        .filter(item => Number.isFinite(item.glass) && item.glass > 0)
        .sort((a, b) => a.glass - b.glass);
      if (liveRows.length) {
        candidateRows = liveRows;
        return candidateRows;
      }
    } catch (e) {
      // fallback til lokal liste kun i demomodus; ellers fortsetter vi med siste kjente data
    }
  }

  if (candidateRows.length) return candidateRows;
  candidateRows = Object.values(CANDIDATE_METADATA).map((meta, index) => ({
    glass: index + 1,
    name: String(meta.name || 'Ukjent øl')
  }));
  return candidateRows;
}

function startCandidateAutoRefresh(){
  if (window.__juleolCandidateRefresh) return;
  window.__juleolCandidateRefresh = setInterval(async () => {
    if (listMode !== 'candidate') return;
    const rows = await loadCandidateRows();
    if (rows.length && document.querySelector('.candidate-panel')) {
      viewList();
    }
  }, 15000);
}

async function viewList(){
  const u = store.get('jot_user');
  if (!u) return viewName();

  if (listMode === 'candidate') {
    const rowsData = await loadCandidateRows();
    const rows = rowsData.map(item => {
      const meta = getCandidateMeta(item.name);
      const info = meta ? `${meta.producer} · ${meta.style || 'Juleøl'} · ${meta.abv}` : 'Kandidat';
      return `
        <div class="candidate-item" data-name="${esc(item.name)}">
          <div class="candidate-main">
            <strong>${esc(item.name)}</strong>
            <small>${esc(info)}</small>
          </div>
          <button type="button" class="candidate-open" data-name="${esc(item.name)}" aria-label="Vis info om ${esc(item.name)}">›</button>
        </div>
      `;
    }).join('');

    show(`${renderToggle('candidate')}<h1>Hei, ${esc(u.name)} 🎄</h1>
      <p class="muted">Alle kandidat-øl i testen, sortert etter glassnummer.</p>
      <div class="candidate-panel">${rows}</div>
      <button class="ghost" id="swap">Ikke ${esc(u.name)}? Bytt deltager</button>`);

    document.querySelectorAll('.candidate-open').forEach(button => {
      button.onclick = () => viewCandidateDetail(button.dataset.name);
    });
    document.querySelectorAll('.candidate-item').forEach(card => {
      card.onclick = e => {
        if (e.target.closest('.candidate-open')) return;
        viewCandidateDetail(card.dataset.name);
      };
    });
    document.querySelectorAll('.switch button').forEach(button => {
      button.onclick = () => { listMode = button.dataset.mode; viewList(); };
    });
    $('#swap').onclick = () => { if (confirm('Bytte deltager på denne telefonen?')) { store.del('jot_user'); mine = {}; viewName(); } };
    return;
  }

  if (listMode === 'list') {
    const ranked = Object.entries(mine)
      .map(([beer, scores]) => ({ beer: Number(beer), score: score(scores) }))
      .sort((a, b) => b.score - a.score || a.beer - b.beer);
    const rows = ranked.length ? ranked.map((item, index) => `
      <button class="list-item" data-beer="${item.beer}" aria-label="Åpne vurdering for Øl ${item.beer}">
        <span>Øl ${item.beer}</span>
        <strong>${item.score.toFixed(1)}</strong>
      </button>
    `).join('') : '<p class="muted">Du har ikke vurdert noen øl ennå.</p>';

    show(`${renderToggle('list')}<h1>Hei, ${esc(u.name)} 🎄</h1>
      <p class="muted">Rangert liste over ølene du har vurdert.</p>
      <div class="list-panel">${rows}</div>
      <button class="ghost" id="swap">Ikke ${esc(u.name)}? Bytt deltager</button>`);

    document.querySelectorAll('.list-item').forEach(item => item.onclick = () => viewRate(Number(item.dataset.beer)));
    document.querySelectorAll('.switch button').forEach(button => {
      button.onclick = () => { listMode = button.dataset.mode; viewList(); };
    });
    $('#swap').onclick = () => { if (confirm('Bytte deltager på denne telefonen?')) { store.del('jot_user'); mine = {}; viewName(); } };
    return;
  }

  const done = Object.keys(mine).length;
  let cells = '';
  for (let i = 1; i <= CONFIG.ANTALL_OL; i++){
    const s = mine[i];
    cells += `<button class="beer ${s ? 'done' : ''}" data-n="${i}">${i}${s ? `<small>${score(s).toFixed(1)}</small>` : ''}</button>`;
  }
  show(`${renderToggle('form')}<h1>Hei, ${esc(u.name)} 🎄</h1>
    <p class="muted">Trykk på nummeret til ølet du har i glasset. ${done} av ${CONFIG.ANTALL_OL} vurdert.</p>
    <div class="grid">${cells}</div>
    <button class="ghost" id="swap">Ikke ${esc(u.name)}? Bytt deltager</button>`);
  document.querySelectorAll('.beer').forEach(b => b.onclick = () => viewRate(+b.dataset.n));
  document.querySelectorAll('.switch button').forEach(button => {
    button.onclick = () => { listMode = button.dataset.mode; viewList(); };
  });
  $('#swap').onclick = () => { if (confirm('Bytte deltager på denne telefonen?')) { store.del('jot_user'); mine = {}; viewName(); } };
}

function viewCandidateDetail(name){
  const meta = getCandidateMeta(name) || { name: String(name), producer: 'Ukjent brygger', style: 'Juleøl', abv: '–', volume: '–', package: '–', image: '', note: 'Ingen ekstra informasjon tilgjengelig.' };
  const image = meta.image ? `<img src="${esc(meta.image)}" alt="${esc(meta.name)}">` : '<div class="muted">Bilde ikke tilgjengelig</div>';
  const rows = [
    ['Produsent', meta.producer],
    ['Stil', meta.style || '–'],
    ['ABV', meta.abv || '–'],
    ['Volum', meta.volume || '–'],
    ['Pakke', meta.package || '–']
  ].map(([label, value]) => `
    <div class="meta-row">
      <strong>${esc(label)}</strong>
      <span>${esc(value)}</span>
    </div>
  `).join('');

  const overlay = document.createElement('div');
  overlay.className = 'detail-overlay';
  overlay.innerHTML = `
    <div class="detail-sheet">
      <div class="row">
        <h2>${esc(meta.name)}</h2>
        <button class="ghost" id="detail-back" type="button">Lukk</button>
      </div>
      <div class="beer-detail">
        <div class="image-wrap">${image}</div>
        <div class="card">
          <div class="meta">${rows}</div>
        </div>
        <div class="card">
          <h3>Beskrivelse</h3>
          <p class="muted" style="margin:0">${esc(meta.note || 'Ingen beskrivelse tilgjengelig.')}</p>
        </div>
      </div>
    </div>
  `;

  const close = () => overlay.remove();
  overlay.addEventListener('click', (event) => {
    if (event.target === overlay) close();
  });
  const back = overlay.querySelector('#detail-back');
  if (back) back.onclick = close;
  document.body.appendChild(overlay);
}

function viewRate(n){
  const cur = (mine[n] || [0,0,0,0]).slice();
  const cats = CONFIG.KATEGORIER.map((c,ci) => `
    <div class="card ${CONFIG.VEKTER[ci] > 1 ? 'key' : ''}"><div class="cat"><span class="cn">${c}${CONFIG.VEKTER[ci] > 1 ? ` <em>teller ×${CONFIG.VEKTER[ci]}</em>` : ''}</span><span id="v${ci}" class="val">${cur[ci] || '–'}</span></div>
    <div class="scale" data-c="${ci}">${Array.from({length:10},(_,k)=>`<button data-v="${k+1}" class="${cur[ci]===k+1?'on':''}">${k+1}</button>`).join('')}</div></div>`).join('');
  show(`<div class="row"><h2>Øl nr. ${n}</h2><button class="ghost" id="back">Tilbake</button></div>
    ${cats}
    <div class="total">Din score: <b id="sum">–</b> / 10</div>
    <button id="save" class="primary" disabled>Lagre</button>`);
  const upd = () => {
    const ok = cur.every(v => v > 0);
    $('#sum').textContent = ok ? score(cur).toFixed(1) : '–';
    $('#save').disabled = !ok;
  };
  document.querySelectorAll('.scale').forEach(sc => sc.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const ci = +sc.dataset.c; cur[ci] = +b.dataset.v;
    sc.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    $('#v'+ci).textContent = cur[ci]; upd();
  });
  $('#back').onclick = viewList;
  $('#save').onclick = async () => {
    const u = store.get('jot_user'); const btn = $('#save');
    btn.disabled = true; btn.textContent = 'Lagrer…';
    try {
      await api('save', { id: u.id, name: u.name, beer: n, scores: cur });
      mine[n] = cur.slice(); toast(`Øl ${n} lagret 🍻`); viewList();
    } catch(e){ btn.disabled = false; btn.textContent = 'Prøv igjen'; toast('Lagring feilet – sjekk nettet'); }
  };
  upd();
}

startCandidateAutoRefresh();
start();
</script>
</body>
</html>
